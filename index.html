<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FFFFFF" />
    <!--
      Add to Home Screen is the only way to lose Safari's chrome on an iPhone: the Fullscreen API
      does not exist there, so the booth screen's Full screen button cannot help. Opened from the
      home-screen icon with these, iOS drops the address bar and the toolbar.
    -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="InnoFest" />
    <link rel="apple-touch-icon" href="/brand/icon-180.png" />
    <title>ADT InnoFest 2026 · Recover the Future</title>
    <script>
      /*
       * LINE opens links in its own browser, and Google refuses to sign anyone in from inside it
       * ("disallowed_useragent") — so an exhibitor tapping the link in the LINE group, or a visitor
       * scanning the poster with LINE's scanner, could never get past "Continue with Google".
       * LINE's own switch, openExternalBrowser=1, hands the page to Chrome / Safari instead.
       * Once only: if the parameter is already there and we are still inside LINE, stay put.
       */
      (function () {
        try {
          if (!/\bLine\/\d/i.test(navigator.userAgent)) return;
          var u = new URL(location.href);
          if (u.searchParams.has('openExternalBrowser')) return;
          u.searchParams.set('openExternalBrowser', '1');
          location.replace(u.toString());
        } catch (e) { /* stay in LINE; email sign-in still works there */ }
      })();
    </script>
    <meta name="description" content="Scan booths, recover project files, unlock rewards · 11 Nov 2026, Indoor Stadium MFU" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://adt-innofest.web.app/" />
    <meta property="og:title" content="ADT InnoFest 2026 · Recover the Future" />
    <meta property="og:description" content="Scan booths, recover project files, unlock rewards · 11 Nov 2026, Indoor Stadium MFU" />
    <meta property="og:image" content="https://adt-innofest.web.app/brand/icon-512.png" />
    <meta name="twitter:card" content="summary" />
    <!--
      The first paint, before a single byte of JavaScript. The bundle is well over a megabyte, so
      on a phone at the gate there were one or two seconds of blank white before React could put
      anything on screen — the one view of this product that belonged to no part of it. Inline, so
      it costs no request; the two images are 8KB and 43KB and are on the same origin.

      It hands over to `<Spinner page />`, which is deliberately the same sky and the same
      breathing wordmark, so the handover is invisible.
    -->
    <style>
      html, body { height: 100%; margin: 0; }
      body { background: #FFFFFF; }
      #boot { position: fixed; inset: 0; display: grid; place-items: center; background: #FFFFFF; }
      #boot .sky { position: absolute; inset: 0 0 auto 0; height: 60%; background-image: linear-gradient(#E2ECFF 1px, transparent 1px), linear-gradient(90deg, #E2F6FF 1px, transparent 1px); background-size: 24px 24px; -webkit-mask-image: linear-gradient(#000, transparent); mask-image: linear-gradient(#000, transparent); }
      #boot .mark { position: relative; width: min(72vw, 300px); animation: boot-breathe 2.6s ease-in-out infinite; }
      #boot.gone { opacity: 0; transition: opacity 260ms ease-out; pointer-events: none; }
      @keyframes boot-breathe {
        0%, 100% { transform: translateY(0) scale(1); opacity: .92; }
        50% { transform: translateY(-6px) scale(1.025); opacity: 1; }
      }
      @media (prefers-reduced-motion: reduce) { #boot .mark { animation: none; } }
    </style>
  </head>
  <body>
    <div id="boot" aria-hidden="true">
      <div class="sky"></div>
      <img class="mark" src="/brand/logo-innofest.webp" alt="" />
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
